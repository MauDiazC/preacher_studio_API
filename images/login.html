<body class="bg-background text-on-background font-body min-h-screen flex flex-col overflow-hidden">
<!-- TopNavBar Suppressed for Transactional Focus -->
<main class="flex-grow flex items-center justify-center relative px-6">

<div class="absolute inset-0 overflow-hidden pointer-events-none">

</div>

<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg">mail</span>
<input class="w-full bg-surface-container-highest border-none rounded-lg py-3.5 pl-12 pr-4 text-on-surface focus:ring-2 focus:ring-primary/30 transition-all placeholder:text-outline/50" id="email" placeholder="nombre@ministerio.org" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="font-label text-label-sm uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<a class="text-xs text-primary hover:text-primary-fixed-dim transition-colors" href="#">Olvidé mi contraseña</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg">lock</span>
<input class="w-full bg-surface-container-highest border-none rounded-lg py-3.5 pl-12 pr-12 text-on-surface focus:ring-2 focus:ring-primary/30 transition-all placeholder:text-outline/50" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<button class="w-full primary-gradient text-on-primary-container font-semibold py-4 rounded-lg shadow-[0px_8px_16px_rgba(85,141,255,0.2)] hover:shadow-[0px_12px_24px_rgba(85,141,255,0.3)] hover:scale-[0.99] active:scale-95 transition-all duration-300" type="submit">
                    Entrar
                </button>
</form>
<!-- Social Provider Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant opacity-20"></div>
</div>
<div class="relative flex justify-center text-xs">
<span class="px-4 bg-transparent text-outline font-label uppercase tracking-tighter">O continuar con</span>
</div>
</div>
<!-- Social Providers -->
<div class="grid grid-cols-2 gap-4">

<span class="material-symbols-outlined text-lg" data-weight="fill">cloud</span>
